[project]
name = "gom-heatwaves"
version = "0.1.0"
description = "Marine heatwaves below the surface of the Gulf of Maine, from NERACOOS buoy data"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20,<2",
    "anyio>=4.10,<5",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<1",
    "netcdf4>=1.7.4,<2",
    "pandas>=3.0,<4",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy>=2.1,<2.2",
    "uvicorn[standard]>=0.54,<1",
    "xarray>=2026.7",
]

[dependency-groups]
dev = [
    "compliance-checker>=6.1",
    "pandas-stubs>=3.0",
    "pytest>=9",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # Starlette's TestClient nudges towards httpx2; it works with httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # Raised by the netCDF4/cftime wheels' numpy ABI check; harmless.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

# pytest --cov measures the app package, branches included; CI fails below fail_under.
[tool.coverage.run]
source = ["heatwaves"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ['if __name__ == "__main__":']

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
