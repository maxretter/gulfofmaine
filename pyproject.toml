[project]
name = "gom-heatwaves"
version = "0.1.0"
description = "Marine heatwaves below the surface of the Gulf of Maine, from NERACOOS buoy data"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "netcdf4>=1.7.4,<2",
    "pandas>=3.0,<4",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy>=2.1,<2.2",
    "uvicorn[standard]>=0.54,<1",
    "xarray>=2026.7",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # Starlette's TestClient nudges towards httpx2; it works with httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # Raised by the netCDF4/cftime wheels' numpy ABI check; harmless.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
