# docker compose up -d --build
# The site is on http://localhost:8000 once the first sync finishes (about a minute).
#
# To serve the NetCDF products from ERDDAP as well, at http://localhost:8000/erddap:
#   docker compose --profile erddap up -d --build
name: gom-heatwaves

# Docker's default json-file driver never rotates its logs; the local driver
# keeps the newest 100 MB of each container's, compressed. When NERACOOS is
# down, the sync job logs a traceback for each dataset every round.
x-logging: &logging
  driver: local

x-backend: &backend
  build: .
  image: gom-heatwaves
  restart: unless-stopped
  # As PID 1, Python ignores SIGTERM, so the sync job took Docker's 10 s and a
  # SIGKILL to stop. Docker's init passes the signal on. The job can stop
  # anywhere: it stores each series in one transaction and replaces each file whole,
  # and it unwinds on the signal, so a file it was writing leaves no partial copy.
  init: true
  logging: *logging
  environment:
    DATABASE_URL: postgresql+psycopg://heatwaves:${POSTGRES_PASSWORD:?set it in .env}@db/heatwaves
  # The NetCDF and CSV products: written by the sync job, served by the API and ERDDAP.
  volumes:
    - products:/data/products

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: heatwaves
      POSTGRES_DB: heatwaves
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "heatwaves"]
      interval: 5s
      retries: 10

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  # The JSON API, the live feed's WebSocket and the product downloads; reached only through the frontend's proxy.
  api:
    <<: *backend
    volumes:
      - products:/data/products:ro
    # A safety net for a runaway request. On a full-size synthetic database, M01's
    # page over its full record peaked near 230 MB, and 40 of the longest daily
    # series at once, as many as its thread pool runs, near 330 MB.
    mem_limit: 1g
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # Fails once no buoy still reporting has synced in SYNC_STALE_AFTER_HOURS (3), as well as if the API is down.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 60s
      timeout: 5s
      start_period: 3m
    # The name Caddy reaches it by. The frontend is also on the host's shared proxy network,
    # where another stack's service could be called plain "api".
    networks:
      default:
        aliases: [gom-heatwaves-api]

  # Checks the buoys still reporting every 10 minutes, and everything hourly.
  sync:
    <<: *backend
    command: ["python", "-m", "heatwaves.sync", "--every", "600"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # The products as ERDDAP datasets (erddap/datasets.xml), for anyone who works in ERDDAP.
  erddap:
    build: ./erddap
    image: gom-heatwaves-erddap
    profiles: [erddap]
    restart: unless-stopped
    logging: *logging
    environment:
      # The public address, without /erddap.
      ERDDAP_baseUrl: ${ERDDAP_BASE_URL:-http://localhost:8000}
      ERDDAP_baseHttpsUrl: ${ERDDAP_BASE_URL:-http://localhost:8000}
    volumes:
      - products:/data/products:ro
      - erddap:/erddapData
    # The name Caddy reaches it by, as the API's.
    networks:
      default:
        aliases: [gom-heatwaves-erddap]

  # The React app, served by Caddy, which forwards /api, /docs and /healthz to the API
  # and /erddap to ERDDAP.
  frontend:
    build: ./frontend
    image: gom-heatwaves-frontend
    restart: unless-stopped
    logging: *logging
    environment:
      # Whose X-Forwarded-For and -Proto Caddy passes on to the API (frontend/Caddyfile).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    # This machine alone: a proxy in front, or a browser here (README, "Running it").
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:80"
    depends_on:
      - api

volumes:
  db:
  products:
  erddap:
