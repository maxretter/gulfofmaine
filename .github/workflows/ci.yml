name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. A push to main
# has no pull request number, so each gets a group of its own and runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: heatwaves
          POSTGRES_PASSWORD: heatwaves
          POSTGRES_DB: heatwaves
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U heatwaves" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://heatwaves:heatwaves@localhost/heatwaves
      TEST_DATABASE_URL: postgresql+psycopg://heatwaves:heatwaves@localhost/heatwaves
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest --cov # fails below the floor in pyproject.toml

  # erddap/datasets.xml in a real ERDDAP, serving sample products, checked against the files.
  erddap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run python -m tests.sample sample-products
      - run: docker build -t gom-heatwaves-erddap erddap
      - name: Start ERDDAP and wait for its datasets
        run: |
          docker run -d --name erddap -p 8080:8080 -v "$PWD/sample-products:/data/products:ro" gom-heatwaves-erddap
          for attempt in $(seq 60); do
            curl -sf http://localhost:8080/erddap/tabledap/gom_heatwaves_events.das > /dev/null && exit 0
            sleep 5
          done
          docker logs erddap 2>&1 | tail -50
          exit 1
      - run: uv run pytest tests/test_erddap.py
        env:
          ERDDAP_URL: http://localhost:8080/erddap
          SAMPLE_PRODUCTS: sample-products

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # includes the type check

  # Each image built and run, and the Compose file that runs them parsed.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        context: [".", "frontend"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          load: true # into Docker, for the steps below
          tags: ci-image
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
      # The image has no dev dependencies, so this catches a runtime one that the test job's would hide.
      - name: Migrations apply in the image, and the app and the sync job import
        if: matrix.context == '.'
        run: >-
          docker run --rm -e DATABASE_URL=sqlite:////tmp/ci.db ci-image
          sh -c 'alembic upgrade head && python -c "import heatwaves.main, heatwaves.sync"'
      - name: Compose accepts compose.yaml
        if: matrix.context == '.'
        run: docker compose --profile erddap config -q
        env:
          POSTGRES_PASSWORD: ci
      - name: Caddy accepts the Caddyfile
        if: matrix.context == 'frontend'
        run: docker run --rm ci-image caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
