name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: heatwaves
          POSTGRES_PASSWORD: heatwaves
          POSTGRES_DB: heatwaves
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U heatwaves" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://heatwaves:heatwaves@localhost/heatwaves
      TEST_DATABASE_URL: postgresql+psycopg://heatwaves:heatwaves@localhost/heatwaves
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # includes the type check

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context: [".", "frontend"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
